{% extends "base.html" %}

{% block title %}Sign in · RamHub{% endblock %}

{% block content %}
  <section class="mx-auto max-w-md py-8 sm:py-14" aria-labelledby="login-title">
    <div class="mb-6 text-center">
      <p class="text-meta font-semibold uppercase tracking-wide text-accent-700">RamHub</p>
      <h1 id="login-title" class="mt-2 text-h1 font-semibold tracking-tight text-neutral-900">
        Welcome back
      </h1>
      <p class="mt-2 text-neutral-600">
        Sign in with your Farmingdale State College account.
      </p>
    </div>

    <div class="card card-pad sm:p-6">
      <form class="space-y-4" aria-label="Demo sign-in form">
        <div>
          <label for="login-email" class="mb-1 block text-meta font-medium text-neutral-800">
            College email
          </label>
          <input id="login-email" name="email" type="email" class="field-input"
                 placeholder="name@farmingdale.edu" autocomplete="off">
        </div>

        <div>
          <label for="login-password" class="mb-1 block text-meta font-medium text-neutral-800">
            Password
          </label>
          <input id="login-password" name="password" type="password" class="field-input"
                 placeholder="Enter your password" autocomplete="off">
        </div>

        <button type="button" class="btn-primary w-full">Sign in</button>
      </form>

      <p class="mt-4 border-t border-neutral-200 pt-4 text-meta text-neutral-500" role="note">
        Demo page only: sign-in is not connected. Do not enter a real password.
      </p>
    </div>
  </section>
{% endblock %}
