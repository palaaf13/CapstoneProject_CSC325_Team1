{% extends "base.html" %}

{% block title %}Password updated · RamHub{% endblock %}

{% block content %}
  <section class="mx-auto max-w-md py-8 sm:py-14" aria-labelledby="reset-complete-title">
    <div class="mb-6 text-center">
      <p class="text-meta font-semibold uppercase tracking-wide text-accent-700">RamHub</p>
      <h1 id="reset-complete-title" class="mt-2 text-h1 font-semibold tracking-tight text-neutral-900">
        Password updated
      </h1>
    </div>
    <div class="card card-pad sm:p-6">
      <p class="text-body text-neutral-700">You can sign in with your new password now.</p>
      <a href="{% url 'login' %}" class="btn-primary mt-4 w-full">Sign in</a>
    </div>
  </section>
{% endblock %}
